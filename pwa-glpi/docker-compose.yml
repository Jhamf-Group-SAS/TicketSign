version: "3.7"

services:
  ticketsign-client:
    image: ghcr.io/jhamfgit/ticketsign-client:latest
    networks:
      - jhamfstack
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.ticketsign.rule=Host(`ticketsign.jhamf.com`)
        - traefik.http.services.ticketsign.loadbalancer.server.port=80
        - traefik.http.routers.ticketsign.entrypoints=websecure
        - traefik.http.routers.ticketsign.tls.certresolver=letsencryptresolver

  ticketsign-server:
    image: ghcr.io/jhamfgit/ticketsign-server:latest
    networks:
      - jhamfstack
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/ticketsign}
      - GLPI_API_URL=${GLPI_API_URL}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - WHATSAPP_WABA_ID=${WHATSAPP_WABA_ID}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_TEMPLATE_NAME=${WHATSAPP_TEMPLATE_NAME:-notificacion_tarea}
      - WHATSAPP_LANG=${WHATSAPP_LANG:-es_CO}
      - JWT_SECRET=${JWT_SECRET}
      # SEGURIDAD [C-01]: OBLIGATORIO - clave AES-256 hex de 64 chars
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # SEGURIDAD: Cuenta de emergencia (login sin GLPI configurado)
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ticketsign_uploads:/app/uploads
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.ticketsign-api.rule=Host(`api-ticketsign.jhamf.com`)
        - traefik.http.services.ticketsign-api.loadbalancer.server.port=5000
        - traefik.http.routers.ticketsign-api.entrypoints=websecure
        - traefik.http.routers.ticketsign-api.tls.certresolver=letsencryptresolver

  mongo:
    image: mongo:latest
    networks:
      - jhamfstack
    volumes:
      - ticketsign_data:/data/db
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  ticketsign_data:
  ticketsign_uploads:


networks:
  jhamfstack:
    external: true
