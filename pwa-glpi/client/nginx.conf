server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    # AUDIT-010: Cabeceras de seguridad completas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: * https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' https://assets.mixkit.co https: *; connect-src 'self' https://api-ticketsign.jhamf.com wss://api-ticketsign.jhamf.com; worker-src 'self' blob:; frame-src 'self' https://api-ticketsign.jhamf.com blob:; manifest-src 'self';" always;
}
